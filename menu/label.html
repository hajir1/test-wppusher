      // Departemen yang sedang aktif ditampilkan (default: pertama di data)
      let activeDept = Object.keys(DEPT_DATA)[0];

      // Render seluruh checkbox departemen di bagian atas
      function renderDeptTabs() {
        const wrap = document.getElementById("dept-tabs");
        wrap.innerHTML = "";

        Object.entries(DEPT_DATA).forEach(([key, dept]) => {
          const item = document.createElement("div");
          item.className = "dept-checkbox-item";
          item.innerHTML = `
                                      <input type="checkbox" id="dept-${key}" ${key === activeDept ? "checked" : ""} />
                                      <label for="dept-${key}">${dept.name}</label>
                                    `;

          const checkbox = item.querySelector("input");
          checkbox.addEventListener("change", () => {
            if (checkbox.checked) {
              // Perilaku single-select: hanya 1 departemen aktif dalam satu waktu
              activeDept = key;
              renderDeptTabs();
              renderDeptDetail();
            } else {
              // Cegah semua checkbox ter-uncheck sekaligus (harus selalu ada 1 aktif)
              checkbox.checked = true;
            }
          });

          wrap.appendChild(item);
        });
      }

      // Render detail departemen yang sedang aktif: banner, SCPL, dan
      // tombol Jenjang Program Studi yang jumlah/isinya dinamis per departemen
      function renderDeptDetail() {
        const dept = DEPT_DATA[activeDept];
        const root = document.getElementById("dept-detail");
        if (!dept) {
          root.innerHTML = `<p class="dprodi-empty">Departemen tidak ditemukan.</p>`;
          return;
        }

        const bannerStyle = dept.image
          ? `background-image:url('${dept.image}');`
          : "";

        const scplHtml =
          dept.scpl && dept.scpl.length
            ? `
                                        <div class="dept-section-title">Standar Capaian Pembelajaran Lulusan (SCPL)</div>
                                        <ul class="dept-scpl-list">

                                           ${dept.scpl.map((point) => `<li><svg viewBox="0 0 8 8"><use href="#icon-dot"></use></svg> <span>${point}</span> </li>`).join("")}
                                        </ul>
                                      `
            : `<p class="dprodi-empty" style="margin-bottom:26px;">Belum ada data SCPL untuk departemen ini.</p>`;
        const selengkapnyaHtml =
          dept.url !== ""
            ? `
                                         <div style="background: url(${dept.imageSelengapnya})" class="banner-gradient-white">
                                            <div class="banner-gradient-white-content">

                                              <h1>Informasi Selengkapnya</h1>
                                              <h3>
                                                Temukan informasi lengkap departmen ${dept.name}.
                                              </h3>
                                              <div class="banner-gradient-white-buttons">
                                                <a
                                                  href="${dept.url}"
                                                  target="_blank"
                                                  class="cta-banner-gradient-white"
                                                >
                                                  Lihat Selengkapnya
                                                  <svg><use href="#icon-arrow"></use> </svg>
                                                </a>
                                              </div>
                                            </div>
                                          </div>
                                      `
            : `<p class="dprodi-empty" style="margin-bottom:26px;">Belum ada data SCPL untuk departemen ini.</p>`;

        const jenjangHtml =
          dept.jenjang && dept.jenjang.length
            ? `
                                        <div style="margin-top:54px;" class="dept-page-header">
                                          <span class="dept-page-header-icon">
                                            <svg viewBox="0 0 33 31"><use href="#icon-leaf"></use></svg>
                                          </span>
                                          <span class="dept-page-header-title">Jenjang Program Studi</span>
                                        </div>
                                        <div class="jenjang-tabs" id="jenjang-tabs"></div>
                                        <div id="jenjang-detail"></div>
                                      `
            : `<p class="dprodi-empty">Belum ada jenjang program studi untuk departemen ini.</p>`;

        root.innerHTML = `
                                    <div class="dept-banner" style="${bannerStyle}">
                                      <div class="dept-banner-title">${dept.name}</div>
                                    </div>
                                    ${scplHtml}
                                    ${selengkapnyaHtml}
                                    ${jenjangHtml}
                                  `;

        // Jenjang (S1/S2/S3, dst.) punya sub-tab + kartu detail sendiri,
        // dirender setelah markup induk terpasang ke DOM.
        if (dept.jenjang && dept.jenjang.length) {
          if (dept._activeJenjangIndex == null) dept._activeJenjangIndex = 0;
          renderJenjangTabs(dept);
          renderJenjangDetailContent(dept);
        }
      }

      // Render sub-tab jenjang (S1/S2/S3, dst.) milik departemen aktif
      function renderJenjangTabs(dept) {
        const wrap = document.getElementById("jenjang-tabs");
        if (!wrap) return;
        wrap.innerHTML = "";

        dept.jenjang.forEach((j, index) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className =
            "jenjang-tab-btn" +
            (index === dept._activeJenjangIndex ? " active" : "");
          btn.textContent = j.label;
          btn.addEventListener("click", () => {
            dept._activeJenjangIndex = index;
            renderJenjangTabs(dept);
            renderJenjangDetailContent(dept);
          });
          wrap.appendChild(btn);
        });
      }

      // Render kartu detail: Visi, Misi, Tujuan, dan Peluang Kerja
      // untuk jenjang yang sedang aktif
      function renderJenjangDetailContent(dept) {
        const root = document.getElementById("jenjang-detail");
        if (!root) return;

        const j = dept.jenjang[dept._activeJenjangIndex];
        if (!j) {
          root.innerHTML = `<p class="dprodi-empty">Data jenjang tidak ditemukan.</p>`;
          return;
        }

        const listOrEmpty = (items, emptyText) =>
          items && items.length
            ? `<ul class="jenjang-info-list">${items
                .map(
                  (point) =>
                    `<li><svg viewBox="0 0 8 8"><use href="#icon-dot"></use></svg><span>${point}</span></li>`,
                )
                .join("")}</ul>`
            : `<p class="dprodi-empty">${emptyText}</p>`;

        root.innerHTML = `
                                    <div class="jenjang-info-card">
                                      <span class="jenjang-badge blue">Arah &amp; Tujuan</span>
                                      <div class="jenjang-info-title">Visi</div>
                                      ${
                                        j.visi
                                          ? `<p class="jenjang-info-text">${j.visi}</p>`
                                          : `<p class="dprodi-empty">Belum ada data Visi untuk jenjang ini.</p>`
                                      }
                                    </div>

                                    <div class="jenjang-info-card">
                                      <span class="jenjang-badge orange">Komitmen</span>
                                      <div class="jenjang-info-title">Misi</div>
                                      ${listOrEmpty(j.misi, "Belum ada data Misi untuk jenjang ini.")}
                                    </div>

                                    <div class="jenjang-info-card">
                                      <span class="jenjang-badge green">Pencapaian</span>
                                      <div class="jenjang-info-title">Tujuan</div>
                                      ${listOrEmpty(j.tujuan, "Belum ada data Tujuan untuk jenjang ini.")}
                                    </div>

                                    <div class="jenjang-info-card">
                                      <span class="jenjang-badge purple">Pembelajaran</span>
                                      <div class="jenjang-info-title">Kurikulum</div>
                                      ${listOrEmpty(j.kurikulum, "Belum ada data kurikulum untuk jenjang ini.")}
                                    </div>

                                    <div class="jenjang-info-card">
                                      <span class="jenjang-badge purple">Prospek Karier</span>
                                      <div class="jenjang-info-title">Peluang Kerja</div>
                                      ${listOrEmpty(
                                        j.peluangKerja,
                                        "Belum ada data Peluang Kerja untuk jenjang ini.",
                                      )}
                                    </div>
                                    <div style="background: url(${j?.imageSelengapnya})" class="banner-gradient-white">
                                      <div class="banner-gradient-white-content">
                                        <h1>Informasi Selengkapnya</h1>
                                        <h3>Temukan informasi lengkap mengenai program studi ${j.label}.
                                        </h3>
                                        <div class="banner-gradient-white-buttons">
                                          <a
                                            href="${j?.url}"
                                            target="_blank"
                                            class="cta-banner-gradient-white"
                                          >
                                            Lihat Selengkapnya
                                            <svg><use href="#icon-arrow"></use> </svg>
                                          </a>
                                        </div>
                                      </div>
                                    </div>

                                  `;
      }

      // ============================================================
      // SUMBER DATA POB (Prosedur Operasional Baku)
      // Tambah / hapus / ubah POB cukup edit array ini, kartu akan
      // otomatis menyesuaikan (dinamis, tidak perlu sentuh markup).
      //
      // Struktur tiap item:
      //   image : url gambar bagan alur (boleh dikosongkan "" dulu)
      //   title : judul bagan alur, ditampilkan overlay putih di atas gambar
      //   desc  : deskripsi singkat di bawah gambar
      //   url   : link tombol "Lihat Selengkapnya" (boleh dikosongkan "" dulu)
      // ============================================================
      const POB_DATA = [
        {
          image: "",
          title:
            "Bagan Alur POB Pelaksanaan Administrasi Kegiatan Bakat dan Minat",
          desc: "Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat.",
          url: "",
        },
        {
          image: "",
          title: "Bagan Alur POB Pemrosesan Penerimaan Beasiswa",
          desc: "Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat.",
          url: "",
        },
        {
          image: "",
          title: "Bagan Alur POB Yudisium Mahasiswa",
          desc: "Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat.",
          url: "",
        },
        {
          image: "",
          title: "Bagan Alur POB Ujian Skripsi",
          desc: "Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat.",
          url: "",
        },
      ];

      // Render seluruh kartu POB dari POB_DATA
      function renderPobList() {
        const root = document.getElementById("pob-list");
        if (!root) return;

        if (!POB_DATA.length) {
          root.innerHTML = `<p class="dprodi-empty">Belum ada data Prosedur Operasional Baku.</p>`;
          return;
        }

        root.innerHTML = POB_DATA.map((pob) => {
          const bannerStyle = pob.image
            ? `background-image:url('${pob.image}');`
            : "";
          const ctaHtml = pob.url
            ? `
                <a href="${pob.url}" target="_blank" class="pob-cta-btn">
                  Lihat Selengkapnya
                  <svg><use href="#icon-arrow"></use></svg>
                </a>
              `
            : `<a href="" target="_blank" class="pob-cta-btn">
                  Lihat Selengkapnya
                  <svg><use href="#icon-arrow"></use></svg>
                </a>`;

          return `
            <div class="pob-card">
              <div class="pob-banner" style="${bannerStyle}">
                <div class="pob-banner-title">${pob.title}</div>
              </div>
              <p class="pob-desc">${pob.desc}</p>
              ${ctaHtml}
            </div>
          `;
        }).join("");
      }

      // ============================================================
      // SUMBER DATA PA (Prosedur Operasional Baku)
      // Tambah / hapus / ubah PA cukup edit array ini, kartu akan
      // otomatis menyesuaikan (dinamis, tidak perlu sentuh markup).
      //
      // Struktur tiap item:
      //   image : url gambar bagan alur (boleh dikosongkan "" dulu)
      //   title : judul bagan alur, ditampilkan overlay putih di atas gambar
      //   desc  : deskripsi singkat di bawah gambar
      //   url   : link tombol "Lihat Selengkapnya" (boleh dikosongkan "" dulu)
      // ============================================================
      const PA_DATA = [
        {
          image: "",
          title:
            "Pedoman Akademik dprodiultas Ilmu Pendidikan",
          desc: "Pedoman Pendidikan ini berisi peraturan dan ketentuan pokok yang berkaitan dengan kegiatan pendidikan dan pembelajaran untuk semua program pendidikan yang diselenggarakan Universitas Negeri Malang. Secara rinci Pedoman ini memuat ketentuan dan uraian tentang jenis pendidikan, sistem administrasi akademik, program pendidikan, ketentuan akademik, dan pengelolaan penyelenggaraan program pendidikan. <br> Pedoman Pendidikan ini bersifat mengikat dan berlaku bagi seluruh sivitas akademika Universitas Negeri Malang yang meliputi dosen pembina matakuliah, dosen Penasihat Akademik (PA), mahasiswa dan peserta program pendidikan di UM, pejabat struktural, serta tenaga kependidikan yang terkait dalam pelaksanaan semua program pendidikan di UM. <br> Untuk mengetahui secara lengkap dan rinci setiap bagian pada Pedoman Pendidikan UM Tahun 2020 dan Program Doktor Jalur Penelitian UM, dapat didownload pada laman berikum",
          url: "",
        },
      ];

      // Render seluruh kartu pa dari pa_DATA
      function renderPaList() {
        const root = document.getElementById("pa-list");
        if (!root) return;

        if (!PA_DATA.length) {
          root.innerHTML = `<p class="dprodi-empty">Belum ada data Prosedur Operasional Baku.</p>`;
          return;
        }

        root.innerHTML = PA_DATA.map((pa) => {
          const bannerStyle = pa.image
            ? `background-image:url('${pa.image}');`
            : "";
          const ctaHtml = pa.url
            ? `
                <a href="${pa.url}" target="_blank" class="pa-cta-btn">
                  Lihat Selengkapnya
                  <svg><use href="#icon-arrow"></use></svg>
                </a>
              `
            : `<a href="" target="_blank" class="pa-cta-btn">
                  Lihat Selengkapnya
                  <svg><use href="#icon-arrow"></use></svg>
                </a>`;

          return `
            <div class="pa-card">
              <div class="pa-banner" style="${bannerStyle}">
                <div class="pa-banner-title">${pa.title}</div>
              </div>
              <p class="pa-desc">${pa.desc}</p>
              ${ctaHtml}
            </div>
          `;
        }).join("");
      }

      // Init awal
      renderDeptTabs();
      renderDeptDetail();
      renderPobList();
      renderPaList();
    </script>
  </body>
</html>
