<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Navbar FMIPA UM</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- BAGIAN ATAS -->
  <div class="navbar-top">
    <div class="navbar-brand">
      <img src="https://via.placeholder.com/55" alt="Logo UM">
      <div class="divider-line"></div>
      <div>
        <div class="text-title">Fakultas Matematika dan<br>Ilmu Pengetahuan Alam</div>
        <div class="text-sub">Universitas Negeri Malang</div>
      </div>
    </div>

    <div class="navbar-right">
      <div class="social-icons">
        <a href="#"><i class="fab fa-youtube"></i></a>
        <a href="#"><i class="fab fa-facebook"></i></a>
        <a href="#"><i class="fab fa-linkedin"></i></a>
        <a href="#"><i class="fab fa-twitter"></i></a>
        <a href="#"><i class="fab fa-tiktok"></i></a>
        <a href="#"><i class="fab fa-instagram"></i></a>
      </div>

      <div class="lang-select">
        <span class="flag"></span> ID <i class="fas fa-chevron-down" style="font-size:10px;"></i>
      </div>

      <div class="search-icon">
        <i class="fas fa-search"></i>
      </div>
    </div>
  </div>

  <!-- GARIS TRANSISI (SOLUSI WARNA) -->
  <div class="navbar-divider"></div>

  <!-- BAGIAN MENU -->
  <div class="navbar-menu">
    <ul>
      <li><a href="#">Home</a></li>
      <li><a href="#">Profil</a></li>
      <li><a href="#">Prospek Karier</a></li>
      <li><a href="#">Akademik</a></li>
      <li><a href="#">Kemahasiswaan</a></li>
      <li><a href="#">Penelitian dan Pengabdian</a></li>
      <li><a href="#">Zona Integritas</a></li>
      <li><a href="#">Unduhan</a></li>
    </ul>
  </div>

</body>
</html>
